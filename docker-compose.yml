services:
  postgres:
    image: postgres:16-alpine
    container_name: eventos-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos_dev
      POSTGRES_DB: eventos
    volumes:
      - eventos_pgdata:/var/lib/postgresql/data

volumes:
  eventos_pgdata:
